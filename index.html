<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自作ゲーム置き場</title>
  <meta name="description" content="自作ゲームや制作中の作品をまとめたページです。">
  <style>
    body {
      font-family: sans-serif;
      background: #0f1220;
      color: white;
      margin: 0;
      padding: 0;
    }

    header {
      background: #1b2140;
      padding: 32px 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    p {
      line-height: 1.6;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: #1a1f36;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    a.button {
      display: inline-block;
      margin-top: 12px;
      background: #4da3ff;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
    }

    a.button:hover {
      background: #2d8cf0;
    }
  </style>
</head>
<body>
  <header>
    <h1>自作ゲーム置き場</h1>
    <p>作ったゲームや制作中の作品をまとめるページです。</p>
  </header>

  <main>
    <div class="card">
      <h2>FPSテスト版</h2>
      <p>ブラウザで動くFPSの試作版です。移動や視点操作、射撃っぽい動きを練習中です。</p>
      <a class="button" href="dodge.html" target="_blank">ゲームを見る</a>
    </div>

    <div class="card">
      <h2>これから追加予定</h2>
      <p>今後ここに新しいゲームを追加していきます。</p>
    </div>
  </main>
</body>
</html>
