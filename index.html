<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自作ゲーム置き場 | ブラウザゲーム公開サイト</title>
  <meta name="description" content="自作のブラウザゲームを公開しているサイトです。避けゲームや制作中のFPSゲームを掲載しています。">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(180deg, #0b1020, #111827, #0f172a);
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px 30px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
    }

    .sub {
      max-width: 700px;
      margin: 0 auto;
    }

    .games {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      padding: 30px 20px 60px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      width: 320px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      text-align: left;
    }

    .card h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .card p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    footer {
      padding: 20px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>自作ゲーム置き場</h1>
    <p class="sub">
      ここは自分で作ったブラウザゲームをまとめるページです。<br>
      避けゲームや制作中のFPSゲームを公開していきます。
    </p>
  </header>

  <main class="games">
    <section class="card">
      <h2>避けゲーム</h2>
      <p>
        上から落ちてくる敵をよけて生き残るブラウザゲームです。<br>
        シンプルだけど、ちゃんと遊べます。
      </p>
      <a class="btn" href="dodge.html">遊ぶ</a>
    </section>

    <section class="card">
      <h2>FPSゲーム</h2>
      <p>
        いま制作を始めようとしている作品です。<br>
        これから少しずつ作っていきます。
      </p>
      <a class="btn" href="fps.html">制作中ページを見る</a>
    </section>
  </main>

  <footer>
    © 2026 自作ゲーム置き場
  </footer>
</body>
</html>
